plugins {
    id 'com.android.application'
    id 'jacoco'
    id 'de.mannodermaus.android-junit5'
}

android {
    namespace 'com.groupone.assignment'
    compileSdk 36

    defaultConfig {
        applicationId 'com.groupone.assignment'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }

    sourceSets {
        main {
            res.srcDirs = [layout.buildDirectory.dir('generated/authoringRes').get().asFile]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.navigation:navigation-fragment:2.10.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.mikepenz:iconics-core:5.6.0'
    implementation 'com.mikepenz:google-material-typeface:4.0.0.4-kotlin'
    implementation 'com.mikepenz:fontawesome-typeface:5.13.3.2-kotlin'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'net.sf.geographiclib:GeographicLib-Java:2.1'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

def generatedAuthoringRes = layout.buildDirectory.dir('generated/authoringRes')
generatedAuthoringRes.get().asFile.mkdirs()

tasks.register('syncAuthoringResources', Sync) {
    from('src/main/res') {
        exclude 'tabs/**'
        exclude 'locales/**'
    }
    from('src/main/res/tabs') {
        into 'layout'
    }

    def localesDir = file('src/main/res/locales')
    def defaultLocale = 'en'
    localesDir.listFiles()
            ?.findAll { it.isFile() && it.name.endsWith('.xml') }
            ?.each { localeFile ->
                if (localeFile.name == 'locales_config.xml') {
                    from(localeFile) { into 'xml' }
                    return
                }
                def language = localeFile.name.substring(0, localeFile.name.length() - 4)
                def folder = language == defaultLocale
                        ? 'values'
                        : "values-${language.replace('_', '-r')}"
                from(localeFile) { into folder }
            }

    into generatedAuthoringRes
}

tasks.matching {
    it.name != 'syncAuthoringResources'
            && (it.name.endsWith('Resources')
            || it.name.endsWith('SourceSetPaths')
            || it.name.endsWith('DeepLinksDebug'))
}.configureEach { dependsOn 'syncAuthoringResources' }

tasks.named('preBuild').configure { dependsOn 'syncAuthoringResources' }

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
    }

    def debugTree = fileTree(
            dir: "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes",
            excludes: ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*']
    )
    classDirectories.setFrom(files(debugTree))
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(fileTree(dir: "$buildDir", includes: [
            'jacoco/testDebugUnitTest.exec',
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
    ]))
}
